name: QBot Beta APK

on:
  push:
    branches:
      - qbotbeta
    tags:
      - 'QbotbetaV*'
  workflow_dispatch:
    inputs:
      version_name:
        description: Beta version name
        required: false
        default: QbotbetaV0.0.4

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android build packages
        run: yes | sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Configure Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Resolve beta version
        env:
          MANUAL_VERSION: ${{ inputs.version_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/}"
          else
            VERSION_NAME="${MANUAL_VERSION:-QbotbetaV0.0.4}"
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=111" >> "$GITHUB_ENV"

      - name: Run unit tests and build debug-signed APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug \
            -PVERSION_NAME="$VERSION_NAME" \
            -PVERSION_CODE="$VERSION_CODE"

      - name: Name APK
        run: cp app/build/outputs/apk/debug/Andclaw.apk "${VERSION_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qbotbeta-${{ github.ref_name }}
          path: Qbotbeta*.apk
          if-no-files-found: error

      - name: Publish tagged beta release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            QBot beta 测试版，使用 GitHub Actions runner 生成的 Android Debug 密钥签名。
            签名与 QbotbetaV0.0.3 不同，无法直接覆盖安装；请先卸载旧版再安装本版，卸载会清除应用本地数据。

            ## 更新内容
            - QQ Bot 任务会回报开始确认、执行进度和实际结果，不再只发送通用的“Finished.”。
            - 支持 QQ 官方富媒体接口回传截图、图片、视频和文件。
            - 设置页显示 QQ 凭证验证、Gateway 连接状态与服务端错误详情。
            - AI 与远程通道设置返回后留在应用设置流程中。
            - 改进 AI API 网络错误详情，并对短暂的连接建立失败重试一次。
          files: Qbotbeta*.apk
