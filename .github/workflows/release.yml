name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.jks

      - name: Extract version from tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == "QbotbetaV0.0.1" ]]; then
            VERSION="$TAG"
            VERSION_CODE=108
          else
            VERSION="${TAG#v}"
            VERSION_CODE=$(echo "$VERSION" | awk -F. '{printf "%d", $1*10000+$2*100+$3}')
          fi
          echo "VERSION_NAME=$VERSION" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease \
            -PVERSION_NAME="${VERSION_NAME}" \
            -PVERSION_CODE="${VERSION_CODE}" \
            -PRELEASE_STORE_FILE=release.jks \
            -PRELEASE_STORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -PRELEASE_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -PRELEASE_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Name APK
        run: cp app/build/outputs/apk/release/Andclaw.apk QbotbetaV0.0.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QbotbetaV0.0.1
          path: QbotbetaV0.0.1.apk
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            QbotbetaV0.0.1.apk \
            --title "Release $TAG" \
            --generate-notes
